<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LatentLink - Sender</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0f14;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 16px;
      gap: 16px;
    }
    h1 { font-size: 1.3rem; margin: 0; font-weight: 600; }
    .sub { color: #8b98a5; font-size: 0.85rem; }
    #drop {
      width: 100%;
      max-width: 420px;
      border: 2px dashed #3a4551;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s;
    }
    #drop:hover { border-color: #58a6ff; }
    #drop input { display: none; }
    #qrWrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    canvas {
      width: 90vmin;
      max-width: 440px;
      image-rendering: pixelated;
      background: #fff;
      border-radius: 8px;
    }
    #status { color: #58a6ff; font-weight: 600; font-size: 1rem; }
    .muted { color: #8b98a5; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>LatentLink Sender</h1>
  <div class="sub">Pick an image - it becomes a stream of QR codes</div>

  <label id="drop">
    <input id="file" type="file" accept="image/*">
    Tap to choose an image
  </label>

  <div id="qrWrap">
    <canvas id="qr"></canvas>
    <div id="status">Preparing...</div>
    <div class="muted">Aim the receiver camera at this screen until all frames are captured.</div>
  </div>

  <script src="/static/vendor/qrcode.js"></script>
  <script src="/static/sender.js"></script>
</body>
</html>
