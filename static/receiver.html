<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LatentLink - Receiver</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #0b0f14;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 16px;
      gap: 14px;
    }
    h1 { font-size: 1.3rem; margin: 0; font-weight: 600; }
    .sub { color: #8b98a5; font-size: 0.85rem; }
    button {
      background: #1f6feb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 22px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #preview {
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      border: 2px solid #3a4551;
      background: #000;
    }
    #progressWrap {
      width: 100%;
      max-width: 480px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    #bar {
      height: 10px;
      border-radius: 5px;
      background: #1c232b;
      overflow: hidden;
    }
    #fill { height: 100%; width: 0; background: #3fb950; transition: width .2s; }
    #progress { font-size: 0.9rem; color: #8b98a5; }
    #result {
      display: none;
      width: 100%;
      max-width: 480px;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #result img { width: 100%; border-radius: 12px; }
  </style>
</head>
<body>
  <h1>LatentLink Receiver</h1>
  <div class="sub">Point your camera at the sender's QR codes</div>

  <button id="start">Start Camera</button>
  <video id="preview" autoplay playsinline muted></video>
  <button id="snap" style="background:#30363d;">Snapshot</button>
  <div id="error" style="display:none; color:#ff7b72; max-width:480px; text-align:center; font-size:0.9rem;"></div>

  <div id="progressWrap">
    <div id="bar"><div id="fill"></div></div>
    <div id="progress">Waiting for frames...</div>
    <div id="debug" style="color:#8b98a5; font-size:0.7rem; font-family:monospace;"></div>
  </div>

  <div id="result">
    <img id="outImg" alt="Reconstructed image">
    <button id="again">Scan Another</button>
  </div>

  <script src="/static/vendor/jsqr.js"></script>
  <script src="/static/receiver.js"></script>
</body>
</html>
